    <script>
      // Ignore benign Vite HMR / WebSocket connection errors in iframe preview per platform guidelines
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (
            firstArg === '[vite]' ||
            (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('WebSocket') !== -1))
          ) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
