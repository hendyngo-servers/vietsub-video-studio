name: Deploy Desktop Clean Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact: desktopApp/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            task: packageReleaseMsi
            artifact: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            task: packageReleaseDmg
            artifact: desktopApp/build/compose/binaries/main/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Native Distribution
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - name: Upload Native Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
